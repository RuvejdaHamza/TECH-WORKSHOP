<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eksploro ide projektesh praktike që mund të ndërtohen gjatë Tech Workshop.">
  <title>Ide projektesh | Tech Workshop</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Kalo te përmbajtja</a>

  <header class="site-header">
    <nav class="primary-nav" aria-label="Navigimi kryesor">
      <div class="container nav-inner">
        <a class="brand" href="index.html" aria-label="Tech Workshop, faqja kryesore">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span>tech<span class="brand-light">workshop</span></span>
        </a>

        <div class="nav-links" aria-label="Faqet kryesore">
          <a class="nav-link" href="index.html">Kreu</a>
          <a class="nav-link" href="about.html">Rreth</a>
          <a class="nav-link" href="agenda.html">Agjenda</a>
          <a class="nav-link" href="projects.html" aria-current="page">Projektet</a>
          <a class="nav-link nav-contact" href="register.html">Regjistrohu <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </nav>
  </header>
    <main id="main-content">
    <section class="page-intro">
      <div class="container">
        <p class="eyebrow">Nga ideja te prototipi</p>
        <h1>Projekte të vogla, <em>mundësi të mëdha.</em></h1>
        <p>Këto janë ide ushtrimesh për workshop-in, jo projekte të përfunduara të pjesëmarrësve.</p>
      </div>
    </section>
        <section class="section-pad">
      <div class="container">
        <div class="project-tools">
          <label class="search-field" for="project-search">Kërko ide
            <input id="project-search" type="search" placeholder="Kërko sipas emrit ose aftësisë" autocomplete="off">
          </label>

          <label class="search-field" for="project-category">Kategoria
            <select id="project-category">
              <option value="all">Të gjitha kategoritë</option>
              <option value="web">Web</option>
              <option value="design">Dizajn</option>
              <option value="logic">Logjikë</option>
            </select>
          </label>
        </div>
                <div class="project-summary" aria-live="polite">
          <p id="project-count">Po përgatiten idetë...</p>
          <p id="project-skills"></p>
        </div>

        <div class="project-grid" id="project-list" aria-live="polite"></div>

        <p class="empty-state" id="project-empty" hidden>
          Nuk u gjet asnjë ide me këto filtra.
        </p>

        <noscript>
          <p class="empty-state">Aktivizo JavaScript në shfletues për të parë dhe filtruar idetë.</p>
        </noscript>
      </div>
    </section>
  </main>
  </body>
</html>
